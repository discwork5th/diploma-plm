# ============================================================================
# Запуск на сервере: docker compose up -d --build
#   app   — приложение (Node.js), снаружи недоступно напрямую
#   caddy — веб-сервер на портах 80/443: сам получает HTTPS-сертификат
#           Let's Encrypt для домена и проксирует запросы в app
# Домен берётся из файла .env рядом с этим файлом (DOMAIN=...).
# ============================================================================
services:
  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env       # настройки ИИ-подбора (создать из backend/.env.example)
    volumes:
      - plm-data:/data           # база и документы
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к Ollama, запущенной на самом сервере

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажи DOMAIN в файле .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # сертификаты: чтобы не перевыпускать при перезапуске
    depends_on:
      - app

volumes:
  plm-data:
  caddy-data:
